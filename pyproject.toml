[project]
name = "renikud-plus"
version = "0.5.0"
description = "ONNX Runtime inference for Hebrew grapheme-to-phoneme conversion (ReNikud Plus)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Maxim Melichov" },
    { name = "Yakov Kolani" },
    { name = "Morris Alper" },
]
keywords = ["hebrew", "g2p", "phonemizer", "onnx", "tts", "niqqud"]
dependencies = [
    "hebrew-num2words>=0.1.0",
    "huggingface-hub>=0.26.0",
    "numpy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

# ONNX Runtime is deliberately not a hard dependency.
#
# `onnxruntime` and `onnxruntime-gpu` are separate distributions that unpack into
# the *same* `onnxruntime/` directory, so pip installs both happily and whichever
# it writes last wins. Depending on the CPU build therefore silently disables
# CUDA for anyone who also asked for `onnxruntime-gpu` — and because pip's
# install order is topological rather than file order, they cannot fix it by
# reordering their requirements. Nothing errors; sessions just run on CPU.
#
# Pick the build that matches the machine:
#     pip install 'renikud-plus[cpu]'
#     pip install 'renikud-plus[gpu]'
# or install onnxruntime yourself alongside plain `renikud-plus`.
[project.optional-dependencies]
cpu = ["onnxruntime>=1.24.2"]
gpu = ["onnxruntime-gpu>=1.24.2"]

[project.urls]
Homepage = "https://github.com/maxmelichov/RenikudPlus"
Repository = "https://github.com/maxmelichov/RenikudPlus"
Issues = "https://github.com/maxmelichov/RenikudPlus/issues"
Model = "https://huggingface.co/notmax123/RenikudPlus"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "renikud_onnx"
